name: Verificar LiterAlura con PostgreSQL

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: literalura_DB
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d literalura_DB"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar el proyecto
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode -DskipTests package
      - name: Arrancar la aplicación y salir del menú
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/literalura_DB
          DB_USERNAME: postgres
          DB_PASSWORD: test_password
        run: |
          printf '0\n' | timeout 120s ./mvnw --batch-mode -DskipTests spring-boot:run > /tmp/literalura.log 2>&1 || {
            tail -n 150 /tmp/literalura.log
            exit 1
          }
          grep -q 'Saliendo...' /tmp/literalura.log || { tail -n 150 /tmp/literalura.log; exit 1; }
